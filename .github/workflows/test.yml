---
name: 🧪 Run Tests

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: read
  # Required for report-coverage to update the PR comment
  pull-requests: write
  # Required for publish-unit-test-result-action to post check runs
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        behave_version: ['behave==1.2.6', 'behave @ git+https://github.com/behave/behave']
    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup and Build
        uses: ./.github/actions/setup-build

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Behave Version
        run: pip install "${{ matrix.behave_version }}"

      - name: 🧪 Run Tests & Generate Coverage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run coverage

      - name: 🧪 Run Tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm test

      - name: 📊 Report Coverage to PR
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./.github/scripts/report-coverage.sh

      - name: 📝 Publish Unit Test Results (Linux)
        if: >
          always() &&
          runner.os == 'Linux' &&
          github.event_name == 'pull_request'
        # v2
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3
        with:
          files: "test-results/**/*.xml"
          check_name: "Unit Test Results (${{ matrix.os }})"
          comment_mode: off
          check_run: true

      - name: 📝 Publish Unit Test Results (Windows)
        if: >
          always() &&
          runner.os == 'Windows' &&
          github.event_name == 'pull_request'
        # v2
        uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3
        with:
          files: 'test-results/**/*.xml'
          check_name: "Unit Test Results (${{ matrix.os }})"
          comment_mode: off
          check_run: true

      - name: 📝 Publish Unit Test Results (macOS)
        if: >
          always() &&
          runner.os == 'macOS' &&
          github.event_name == 'pull_request'
        # v2
        uses: EnricoMi/publish-unit-test-result-action/macos@d0a4676d0e0b938bc201470d88276b7c74c712b3
        with:
          files: "test-results/**/*.xml"
          check_name: "Unit Test Results (${{ matrix.os }})"
          comment_mode: off
          check_run: true
