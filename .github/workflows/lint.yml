---
name: 🛡️ Code Quality Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write # Required for Super-Linter to post commit statuses

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚙️ Setup and Build
        uses: ./.github/actions/setup-build

      - name: 📋 Check Configuration Sync
        run: npm run check:config

      - name: 📦 Validate Marketplace Metadata
        run: npx vsce ls

      - name: 🧹 Lint Codebase (Markdown, YAML, Actions)
        # v7
        uses: super-linter/super-linter@34dfdddf86c8da9508e3c52eb27bd8ac98d5d8a6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_PYTHON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_GITHUB_ACTIONS: true
          FILTER_REGEX_EXCLUDE: '(\.venv/|_pycache_/|reports/|\.git/|\.pytest_cache/|node_modules/|dist/|coverage/)'
