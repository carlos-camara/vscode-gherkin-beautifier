---
name: 🧪 E2E Tests

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: read
  # Required for publish-unit-test-result-action to post check runs
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run E2E UI Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup and Build
        uses: ./.github/actions/setup-build

      - name: 💾 Cache VS Code Test Binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-vscode-test-${{
              hashFiles('package-lock.json')
            }}

      - name: 🎭 Run End-to-End Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: 🎭 Run End-to-End Tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: 📝 Publish E2E Test Results (Linux)
        if: >
          always() &&
          runner.os == 'Linux' &&
          github.event_name == 'pull_request'
        # v2
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3
        with:
          files: "test-results/**/*.xml"
          check_name: "E2E Test Results (${{ matrix.os }})"
          comment_mode: off
          check_run: true

      - name: 📝 Publish E2E Test Results (Windows)
        if: >
          always() &&
          runner.os == 'Windows' &&
          github.event_name == 'pull_request'
        # v2
        uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3
        with:
          files: 'test-results/**/*.xml'
          check_name: "E2E Test Results (${{ matrix.os }})"
          comment_mode: off
          check_run: true

      - name: 📝 Publish E2E Test Results (macOS)
        if: >
          always() &&
          runner.os == 'macOS' &&
          github.event_name == 'pull_request'
        # v2
        uses: EnricoMi/publish-unit-test-result-action/macos@d0a4676d0e0b938bc201470d88276b7c74c712b3
        with:
          files: "test-results/**/*.xml"
          check_name: "E2E Test Results (${{ matrix.os }})"
          comment_mode: off
          check_run: true
